<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <!-- c7-wasm: 不再写 maximum-scale=1 —— 它同时禁用双指缩放，等于抢走浏览器的无障碍
         能力（低视力用户只能靠缩放读界面）。缩放交给浏览器默认；Compose 自己的手势
         仍然靠 canvas 上自带的 touch-action 生效，这里不需要额外限制。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vade</title>
    <style>
        html, body { height: 100%; margin: 0; background: #f1f3f6; }
        /* ComposeViewport appends its canvas to body; make it fill the viewport.
           outline:none 只去掉浏览器默认描边：canvas 拿到焦点后由应用自己画焦点环。 */
        canvas { outline: none; }
    </style>
</head>
<body>
<script src="composeApp.js"></script>
</body>
</html>
