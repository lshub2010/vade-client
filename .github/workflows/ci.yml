name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 (preview channel)
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Desktop tests
        run: gradle :composeApp:desktopTest --rerun --no-daemon --console=plain

      - name: Android APK (compile + package)
        run: gradle :composeApp:assembleDebug --no-daemon --console=plain

      - name: Wasm compile
        run: gradle :composeApp:compileKotlinWasmJs --no-daemon --console=plain

      - name: Test report summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("composeApp/build/test-results/desktopTest/TEST-*.xml")
          tests = failures = errors = skipped = 0
          for f in files:
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
          print(f"files={len(files)} tests={tests} failures={failures} errors={errors} skipped={skipped}")
          PY
