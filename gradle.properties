# Shared build settings for the UI module.
#
# Matrix: Gradle 9.6.1 + AGP 9.5.1 + Kotlin 2.4.20 + CMP 1.12.0 + compileSdk 37.
# Verified end-to-end in spike/miuix (RESULT.md §八): APK builds, Desktop and Wasm
# still compile. The two `android.*` switches below are the documented AGP 9
# bypass for a `com.android.application` module that also applies the Kotlin
# Multiplatform plugin; they are DEPRECATED and removed in AGP 10 (then this
# module has to be split into `shared` + `androidApp`, see ui/README.md).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official

android.useAndroidX=true
android.enableJetifier=false

# AGP 9.5.1 understands `compileSdk = 37` (platforms/android-37.0). The warning
# suppression keeps a "supported-but-newer SDK" notice from reading as a failure.
android.suppressUnsupportedCompileSdk=37

# AGP 9.0+ refuses com.android.application + org.jetbrains.kotlin.multiplatform on
# the same module unless BOTH switches are off; turning off only one still fails at
# configuration time (`android.newDsl=true is enabled by default`). Proven in
# spike/miuix RESULT.md §8.2 ②③.
android.builtInKotlin=false
android.newDsl=false

# A5 · single version source. The composeApp build injects this into the generated
# vade.ui.buildconfig.VadeBuildConfig (read by the 关于 page) and derives the Android
# versionName + the jpackage packageVersion from it. Bump here, nowhere else.
vadeVersion=0.1.0-beta
